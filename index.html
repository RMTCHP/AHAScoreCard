<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AHA Score Card</title><style>
:root{--n:#082d57;--b:#176bd1;--bg:#f4f7fb;--i:#172638;--m:#6b7787;--l:#dfe6ee;--g:#087b55;--r:#b83b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}header{background:linear-gradient(115deg,var(--n),var(--b));color:#fff;padding:20px max(20px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}header p{margin:4px 0 0;opacity:.8;font-size:13px}.wrap{max-width:1100px;margin:25px auto;padding:0 18px}.login,.panel,.stat{background:#fff;border:1px solid var(--l);border-radius:14px}.login{max-width:410px;margin:65px auto;padding:30px}.login h2{margin:0 0 8px}.hint,small{color:var(--m);font-size:13px}label{display:grid;gap:6px;margin:11px 0;color:var(--m);font-size:13px;font-weight:650}input,select{padding:10px;border:1px solid #c7d1de;border-radius:8px;font:inherit;background:#fff}button{background:var(--b);border:0;color:#fff;padding:10px 14px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}button.alt{background:#e9f2fe;color:#115aa8}button.logout{background:transparent;border:1px solid #ffffff66;padding:8px 11px}.hidden{display:none!important}.error{color:var(--r);font-size:13px;min-height:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.stat{padding:16px}.stat b{display:block;font-size:28px;margin-top:6px}.panel{padding:18px;margin-top:18px}.panel h2{font-size:18px;margin:0}.head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.team{display:grid;grid-template-columns:46px 1fr auto;gap:13px;padding:13px 3px;align-items:center;border-bottom:1px solid var(--l)}.team:last-child{border:0}.no{color:var(--b);font-weight:800;text-align:center}.team b{display:block}.tag{font-size:12px;font-weight:700;color:var(--m);background:#f0f3f7;padding:5px 9px;border-radius:16px;margin-right:7px}.tag.done{background:#e5f7ee;color:var(--g)}.modal{position:fixed;inset:0;background:#0b1d3280;padding:18px;display:grid;place-items:center}.dialog{background:#fff;width:min(820px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:22px}.dialog h2{margin:0 0 4px}.criterion{display:grid;grid-template-columns:1fr 280px;gap:15px;border-top:1px solid var(--l);padding:15px 0}.criterion h3{font-size:15px;margin:0 0 5px}.criterion p{margin:0;color:var(--m);font-size:13px}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.scale label{margin:0;padding:7px;text-align:center;border:1px solid #cbd5e0;border-radius:7px;cursor:pointer}.scale label:has(input:checked){background:#e7f1ff;border-color:var(--b);color:#0d56ad}.scale input{display:none}.total{margin:12px 0;padding:10px;background:#edf5ff;border-radius:8px;color:#0755a7;font-weight:800}.foot{display:flex;justify-content:flex-end;gap:10px;padding-top:14px;border-top:1px solid var(--l)}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--l);text-align:left}th{color:var(--m);font-size:12px}.right{text-align:right}.formrow{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:9px;align-items:end}@media(max-width:650px){.stats{grid-template-columns:1fr}.team{grid-template-columns:34px 1fr}.team div:last-child{grid-column:2}.criterion{grid-template-columns:1fr}.formrow{grid-template-columns:1fr}.dialog{padding:17px}}
</style></head><body>
<header><div><h1>AHA Score Card</h1><p>ระบบประเมินผลงาน AHA</p></div><button id="logout" class="logout hidden" onclick="logout()">ออกจากระบบ</button></header><main class="wrap"><section id="loginBox" class="login"><h2>เข้าสู่ระบบ</h2><p class="hint">สำหรับกรรมการและผู้ดูแลระบบ</p><label>Username<input id="username" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><div id="loginError" class="error"></div><button style="width:100%" onclick="login()">เข้าสู่ระบบ</button></section><section id="app" class="hidden"><div id="content">กำลังโหลดข้อมูล…</div></section></main><section id="modal" class="modal hidden"><div class="dialog" id="dialog"></div></section><iframe name="ahaRpcFrame" id="ahaRpcFrame" class="hidden"></iframe>
<script>
// This URL is the deployed Google Apps Script Web App. Do not replace it with the GitHub URL.
const API_URL='https://script.google.com/macros/s/AKfycbwWdhgI_t47VOcFYK2hIguBGL8dsXKXaGc9B_Iovc2d3Q8I0J0yGG2ctfvd2ALSNdQ/exec';
let token=sessionStorage.getItem('ahaToken'),data=null,team=null,pending={};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rpc(method,...args){return new Promise((resolve,reject)=>{const id=crypto.randomUUID(),timer=setTimeout(()=>{delete pending[id];reject(new Error('การเชื่อมต่อหมดเวลา กรุณาลองใหม่'))},35000);pending[id]={resolve,reject,timer};const f=document.createElement('form');f.method='post';f.action=API_URL;f.target='ahaRpcFrame';const x=document.createElement('input');x.type='hidden';x.name='payload';x.value=JSON.stringify({id,method,args,origin:location.origin});f.append(x);document.body.append(f);f.submit();f.remove();});}
addEventListener('message',e=>{const m=e.data;if(!m||!m.ahaRpc||!pending[m.id])return;const p=pending[m.id];clearTimeout(p.timer);delete pending[m.id];m.ok?p.resolve(m.data):p.reject(new Error(m.error||'เกิดข้อผิดพลาด'));});
async function login(){let box=$('loginError');box.textContent='';try{let r=await rpc('login',$('username').value.trim(),$('password').value);token=r.token;sessionStorage.setItem('ahaToken',token);load()}catch(e){box.textContent=e.message}}
function logout(){sessionStorage.removeItem('ahaToken');token=null;data=null;$('app').classList.add('hidden');$('loginBox').classList.remove('hidden');$('logout').classList.add('hidden')}
async function load(){try{data=await rpc('getAppData',token);$('loginBox').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');render()}catch(e){logout();$('loginError').textContent='Session หมดอายุ กรุณาเข้าสู่ระบบใหม่'}}
function render(){$('content').innerHTML=data.user.role==='admin'?adminView():judgeView()}
function judgeView(){let s=data.myScores||{},n=Object.keys(s).length;return `<div class="stats"><div class="stat"><small>กรรมการ</small><b>${esc(data.user.name)}</b></div><div class="stat"><small>ประเมินแล้ว</small><b>${n}/${data.teams.length}</b></div><div class="stat"><small>เหลือ</small><b>${data.teams.length-n} ทีม</b></div></div><section class="panel"><div class="head"><h2>รายชื่อกลุ่มแข่งขัน</h2><span class="hint">กดให้คะแนนหรือแก้ไขได้ตลอด</span></div>${data.teams.map(t=>`<div class="team"><span class="no">${esc(t.no)}</span><div><b>${esc(t.name)}</b><small>${esc(t.theme)} · ${esc(t.department||'-')}</small></div><div><span class="tag ${s[t.id]?'done':''}">${s[t.id]?'บันทึกแล้ว':'ยังไม่ประเมิน'}</span><button class="alt" onclick="openScore('${esc(t.id)}')">${s[t.id]?'แก้ไข':'ให้คะแนน'}</button></div></div>`).join('')}</section>`}
function adminView(){let r=data.results||[];return `<div class="stats"><div class="stat"><small>ทีมแข่งขัน</small><b>${data.teams.length}</b></div><div class="stat"><small>กรรมการ</small><b>${data.judgeCount}</b></div><div class="stat"><small>รายการคะแนน</small><b>${data.scoreCount}</b></div></div><section class="panel"><div class="head"><h2>สรุปผลคะแนน</h2></div><table><thead><tr><th>อันดับ</th><th>ทีม</th><th class="right">เฉลี่ย</th><th class="right">ประเมินแล้ว</th></tr></thead><tbody>${r.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b><small>${esc(x.theme)}</small></td><td class="right">${(+x.average).toFixed(2)}</td><td class="right">${x.judges}/${data.judgeCount}</td></tr>`).join('')||'<tr><td colspan="4">ยังไม่มีคะแนน</td></tr>'}</tbody></table></section><section class="panel"><div class="head"><h2>เพิ่มทีมแข่งขัน</h2></div><div class="formrow"><label>ชื่อทีม<input id="tn"></label><label>Theme<input id="tt"></label><label>ผู้นำเสนอ<input id="tp"></label><label>แผนก<input id="td"></label><button onclick="addTeam()">เพิ่มทีม</button></div><div id="teamError" class="error"></div></section><section class="panel"><div class="head"><h2>เพิ่มผู้ใช้</h2></div><div class="formrow"><label>ชื่อ<input id="un"></label><label>Username<input id="uu"></label><label>Password<input id="up" type="password"></label><label>สิทธิ์<select id="ur"><option value="judge">กรรมการ</option><option value="admin">Admin</option></select></label><button onclick="addUser()">เพิ่มผู้ใช้</button></div><div id="userError" class="error"></div></section>`}
function openScore(id){team=data.teams.find(t=>t.id===id);let old=(data.myScores||{})[id]?.ratings||{};$('dialog').innerHTML=`<h2>${esc(team.no)}. ${esc(team.name)}</h2><p class="hint">${esc(team.theme)}</p><div id="total" class="total"></div>${data.criteria.map(c=>`<div class="criterion"><div><h3>${esc(c.no)}. ${esc(c.item)} (${c.weight}%)</h3><p>${esc(c.perspective)}</p></div><div class="scale">${[1,2,3,4,5].map(n=>`<label><input name="c${c.no}" type="radio" value="${n}" ${+old[c.no]===n?'checked':''} onchange="calc()">${n}</label>`).join('')}</div></div>`).join('')}<div class="foot"><button class="alt" onclick="closeScore()">ยกเลิก</button><button onclick="saveScore()">บันทึกคะแนน</button></div>`;$('modal').classList.remove('hidden');calc()}
function closeScore(){$('modal').classList.add('hidden')}function calc(){let sum=0;data.criteria.forEach(c=>{let q=document.querySelector(`input[name="c${c.no}"]:checked`);if(q)sum+=+q.value/5*c.weight});$('total').textContent=`คะแนนถ่วงน้ำหนัก: ${sum.toFixed(2)} / 100`}
async function saveScore(){let ratings={};for(const c of data.criteria){let q=document.querySelector(`input[name="c${c.no}"]:checked`);if(!q)return alert('กรุณาให้คะแนนครบทุกหัวข้อ');ratings[c.no]=+q.value}try{await rpc('saveScore',token,{teamId:team.id,ratings});closeScore();load()}catch(e){alert(e.message)}}
async function addTeam(){let box=$('teamError');box.textContent='';try{await rpc('addTeam',token,{name:$('tn').value,theme:$('tt').value,presenter:$('tp').value,department:$('td').value});load()}catch(e){box.textContent=e.message}}
async function addUser(){let box=$('userError');box.textContent='';try{await rpc('addUser',token,{name:$('un').value,username:$('uu').value,password:$('up').value,role:$('ur').value});load()}catch(e){box.textContent=e.message}}
if(token)load();
</script></body></html>
